name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packager
        run: python -m pip install pyinstaller
      - name: Build desktop program
        run: python -m PyInstaller --noconfirm --onefile --windowed --name NETBOOST desktop.py
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        run: "& 'C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe' setup.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: NETBOOST-setup
          path: Output/NETBOOST-setup.exe
