name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packager
        run: python -m pip install pyinstaller
      - name: Build NETBOOST.exe
        run: python -m PyInstaller --noconfirm --onefile --name NETBOOST --add-data "netboost/ui/index.html;netboost/ui" launch.py
      - uses: actions/upload-artifact@v4
        with:
          name: NETBOOST-exe
          path: dist/NETBOOST.exe
